<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Design Safety MY assurance chain</title><desc id="d">Legal duties, design decisions, hazards, controls, evidence and handover linked in one workflow.</desc><rect width="1500" height="900" rx="34" fill="#f3f6f8"/><text x="70" y="75" font-family="Arial" font-size="30" font-weight="700" fill="#12355d">Prevention-through-design assurance chain</text><text x="70" y="112" font-family="Arial" font-size="17" fill="#607084">Malaysia CDM 2024 · duty, risk, control and evidence remain linked</text><g stroke="#91a5b8" stroke-width="5" fill="none"><path d="M310 280H480M700 280H870M1090 280V500H900M680 500H510M290 500V690H480M700 690H870"/></g><g fill="#ef8b22"><path d="M465 270l22 10-22 10zM855 270l22 10-22 10zM915 490l-22 10 22 10zM525 490l-22 10 22 10zM465 680l22 10-22 10zM855 680l22 10-22 10z"/></g><g font-family="Arial"><g transform="translate(70 195)"><rect width="240" height="170" rx="23" fill="#12355d"/><text x="25" y="42" font-size="14" fill="#bfd4e4">01 · ACCOUNTABILITY</text><text x="25" y="90" font-size="26" font-weight="700" fill="#fff">Legal duty</text><text x="25" y="130" font-size="15" fill="#d4e1eb">Client · designer ·</text><text x="25" y="154" font-size="15" fill="#d4e1eb">principal designer</text></g><g transform="translate(480 195)"><rect width="220" height="170" rx="23" fill="#fff" stroke="#d4dee7"/><text x="24" y="42" font-size="14" fill="#286c9e">02 · DESIGN</text><text x="24" y="90" font-size="26" font-weight="700" fill="#12355d">Decision</text><text x="24" y="130" font-size="15" fill="#607084">Element, change,</text><text x="24" y="154" font-size="15" fill="#607084">assumption, revision</text></g><g transform="translate(870 195)"><rect width="220" height="170" rx="23" fill="#fff" stroke="#d4dee7"/><text x="24" y="42" font-size="14" fill="#286c9e">03 · RISK</text><text x="24" y="90" font-size="26" font-weight="700" fill="#12355d">Hazard pathway</t