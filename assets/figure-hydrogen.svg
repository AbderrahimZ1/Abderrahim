<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Hydrogen incident data to physics reconstruction workflow</title><desc id="d">Author redraw of the workflow linking 954 hydrogen incidents to screening-level physical descriptors and uncertainty.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f2f50"/><stop offset="1" stop-color="#2a6f9e"/></linearGradient></defs><rect width="1500" height="900" rx="34" fill="#f5f8fa"/><text x="70" y="75" font-family="Arial" font-size="30" font-weight="700" fill="#12355d">From incident records to physics-based screening</text><text x="70" y="112" font-family="Arial" font-size="17" fill="#607084">954 hydrogen incidents · Fire Technology 62(5), Article 128</text><g stroke="#9cafbf" stroke-width="5" fill="none"><path d="M285 335H430M630 335H775M975 335H1120"/><path d="M1220 450V585H850"/></g><g fill="#ef8b22"><path d="M415 325l22 10-22 10zM760 325l22 10-22 10zM1105 325l22 10-22 10zM865 575l-22 10 22 10z"/></g><g font-family="Arial"><g transform="translate(70 230)"><rect width="215" height="210" rx="24" fill="url(#g)"/><text x="25" y="44" font-size="14" fill="#bfd4e4">01 · INCIDENT DATA</text><text x="25" y="93" font-size="27" font-weight="700" fill="#fff">HIAD 2.1</text><text x="25" y="132" font-size="16" fill="#d4e1eb">Events, facilities,</text><text x="25" y="158" font-size="16" fill="#d4e1eb">release context and</text><text x="25" y="184" font-size="16" fill="#d4e1eb">consequences</text></g><g transform="translate(430 230)"><rect width="200" height="210" rx="24" fill="#fff" stroke="#d6e0e8"/><text x="24" y="44" font-size="14" fill="#286c9e">02 · CONSOLIDATE</text><text x="24" y="93" font-size="25" font-weight="700" fill="#12355d">Master dataset</text><text x="24" y="135" font-size="16" fill="#607084">Four tables merged</text><text x="24" y="164" font-size="16" fill="#607084">and identifiers aligned</text></g><g transform="translate(775 230)"><rect width="200" height="210" rx="24" fill="#fff" stroke="#d6e0e8"/><text x="24" y="44" font-size="14" fill="#286c9e">03 · RECONSTRUCT</text><text x="24" y="93" font-size="25" font-weight="700" fill="#12355d">Physical descriptors</text><text x="24" y="132" font-size="15" fill="#607084">Fuel mass · HRR</text><text x="24" y="159" font-size="15" fill="#607084">Flame length · energy</text></g><g transform="translate(1120 230)"><rect width="240" height="210" rx="24" fill="#fff6ea" stroke="#ef8b22"/><text x="24" y="44" font-size="14" fill="#a34e00">04 · UNCERTAINTY</text><text x="24" y="93" font-size="25" font-weight="700" fill="#12355d">Monte Carlo</text><text x="24" y="132" font-size="15" fill="#607084">Missing and uncertain</text><text x="24" y="159" font-size="15" fill="#607084">inputs propagated</text></g><g transform="translate(600 585)"><rect width="500" height="170" rx="25" fill="#12355d"/><text x="32" y="45" font-size="14" fill="#bfd4e4">05 · INTERPRET</text><text x="32" y="92" font-size="27" font-weight="700" fill="#fff">Comparative screening, not measurement</text><text x="32" y="129" font-size="16" fill="#d4e1eb">Exposure, confinement, ignition timing and mitigation remain decisive.</text></g></g></svg>